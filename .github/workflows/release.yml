name: Release

# Push an annotated tag like v0.2.0 to build the package and create a GitHub
# release. The tag must match __version__, and CHANGELOG.md must already contain
# that version (generate it with git-cliff first, see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history and all tags
      # actions/checkout may fetch the pushed tag without its annotation; the tag
      # message is part of the release notes, so fetch the real tag objects.
      - name: Fetch annotated tags
        run: git fetch --force --tags origin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check tag, version and changelog
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/labgrid_tui/__init__.py').read())[1])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version - run git cliff before tagging"
            exit 1
          fi
      - run: pip install build git-cliff
      - run: python -m build
      - name: Release notes from git-cliff
        run: git cliff --latest --strip all > release-notes.md && cat release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
