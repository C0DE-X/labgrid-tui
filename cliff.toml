# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Generate the full changelog for a new release (before tagging):
#   git cliff --tag v0.2.0 -o CHANGELOG.md
# Preview what's unreleased:
#   git cliff --unreleased
#
# Commit messages follow Conventional Commits: feat:, fix:, docs:, refactor:, …
# A "!" or a "BREAKING CHANGE:" footer marks a breaking change.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the project uses
[Semantic Versioning](https://semver.org/). It is generated from the commit
history with [git-cliff](https://git-cliff.org).
"""
body = """
{%- macro remote_url() -%}
  https://github.com/C0DE-X/labgrid-tui
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% if message %}
{{ message | trim }}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
  {% if commit.breaking %}**Breaking:** {% endif -%}
  {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
  ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/C0DE-X/labgrid-tui/compare/{{ release.previous.version }}..{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/C0DE-X/labgrid-tui/releases/tag/{{ release.version }}
{% else -%}
[unreleased]: https://github.com/C0DE-X/labgrid-tui/compare/{{ release.previous.version }}..HEAD
{% endif -%}
{% endfor -%}"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  # Not interesting for users of the tool:
  { message = "^chore: [Ii]nitial commit", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|test|style|build)", skip = true },
]
